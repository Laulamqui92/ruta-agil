<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
<meta name="author" content="Laura Lamprea Quiroga · @lauralampreaquiroga">
<meta name="description" content="Herramientas para aplicar Scrum y Kanban en todo el ciclo de una auditoría interna. Funcionan sin conexión.">
<title>Kit de auditoría ágil</title>
<style id="css">/* Kit de auditoría ágil · Laura Lamprea Quiroga
   Disposición: cabecera fija, hilo del ciclo como navegación y una vista de trabajo por etapa.
   Mismo lenguaje visual de la conferencia: negro, marfil y oro, serif para los títulos. */
:root{
  color-scheme:dark;
  --fondo:#09090B;--fondo2:#0D0D10;--sup:#121215;--sup2:#17171B;
  --tinta:#EEE9DF;--tinta2:#CFC8BA;--apag:#9A9488;--apag2:#878277;
  --oro:#C9B27C;--oro2:#E6D3A3;--oro3:#9C8550;--sobreoro:#0B0A08;
  --hilo:rgba(201,178,124,.38);--hilo2:rgba(238,233,223,.12);--hilo3:rgba(238,233,223,.06);
  --terra:#B98274;--terra2:#E2BFB5;--salvia:#93B19F;--salvia2:#C6DCCD;--acero:#93A9C6;--acero2:#D7E1EE;
  --tarj:rgba(255,255,255,.028);--velo:rgba(5,5,6,.78);
  --n-oro1:#EADBAA;--n-oro2:#D8C487;--n-vd1:#BFD6C7;--n-vd2:#A3C0AF;--n-az1:#C3D0E3;--n-az2:#A8B9D2;--n-te1:#E6C5BB;--n-te2:#D2A698;--n-gr1:#DAD6CC;--n-gr2:#C2BDB1;--n-tinta:#17140D;
  --sombra:0 14px 26px rgba(0,0,0,.5);--sombra2:0 40px 120px rgba(0,0,0,.7);
  --luz1:rgba(201,178,124,.10);--luz2:rgba(147,169,198,.07);
  --serif:"Sitka Banner","Sitka Display","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --lado:max(16px,env(safe-area-inset-left,0px));--lado2:max(16px,env(safe-area-inset-right,0px));
}
:root[data-tema="claro"]{
  color-scheme:light;
  --fondo:#F2EEE5;--fondo2:#ECE7DC;--sup:#FAF8F2;--sup2:#FFFFFF;
  --tinta:#17140D;--tinta2:#3B372F;--apag:#5F5A50;--apag2:#6B665C;
  --oro:#7A6226;--oro2:#5C4716;--oro3:#B39A5C;--sobreoro:#FFFDF7;
  --hilo:rgba(138,111,46,.42);--hilo2:rgba(23,20,13,.16);--hilo3:rgba(23,20,13,.07);
  --terra:#A2513F;--terra2:#7E3A2B;--salvia:#4F7A62;--salvia2:#2F5A43;--acero:#4C6A91;--acero2:#2F4B70;
  --tarj:rgba(255,255,255,.6);--velo:rgba(60,54,40,.42);
  --sombra:0 10px 22px rgba(60,50,20,.18);--sombra2:0 30px 80px rgba(60,50,20,.28);
  --luz1:rgba(201,178,124,.22);--luz2:rgba(147,169,198,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;-webkit-text-size-adjust:100%;overflow-x:clip}
body{min-height:100%;background:var(--fondo);color:var(--tinta);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:1.5px solid var(--oro2);outline-offset:2px}
::selection{background:var(--oro);color:var(--sobreoro)}
.serif{font-family:var(--serif)}
.num{font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* fondo */
#fondo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(1500px 900px at 82% -5%,var(--luz1),transparent 62%),radial-gradient(1100px 800px at -5% 105%,var(--luz2),transparent 60%),var(--fondo)}
#fondo i{position:absolute;width:1200px;height:1200px;left:55%;top:-560px;border-radius:50%;background:radial-gradient(circle,var(--luz1),transparent 65%);animation:luz 38s ease-in-out infinite alternate}
#fondo b{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@keyframes luz{to{transform:translate(-620px,460px)}}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

/* cabecera */
.cab{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:18px;padding:12px var(--lado2) 12px var(--lado);background:color-mix(in srgb,var(--fondo) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--hilo2)}
.marca{display:flex;align-items:baseline;gap:10px;white-space:nowrap;text-decoration:none;color:var(--tinta)}
.marca b{font:400 21px/1 var(--serif);letter-spacing:-.005em}
.marca b em{font-style:italic;color:var(--oro2)}
.selaud{position:relative;min-width:0;flex:1 1 auto;max-width:520px}
.selaud>button{display:flex;align-items:center;gap:10px;width:100%;min-width:0;background:none;border:0;border-left:1px solid var(--hilo2);padding:4px 0 4px 18px;text-align:left}
.selaud>button span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;color:var(--tinta2)}
.selaud>button small{display:block;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--apag2)}
.selaud>button:hover span{color:var(--oro2)}
.acc{margin-left:auto;display:flex;align-items:center;gap:8px}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:36px;padding:7px 16px;border:1px solid var(--hilo);background:color-mix(in srgb,var(--oro) 5%,transparent);color:var(--tinta);font-size:13px;letter-spacing:.05em;white-space:nowrap;transition:background .35s var(--ease),border-color .35s,color .35s,transform .35s var(--ease)}
.bt:hover{background:color-mix(in srgb,var(--oro) 14%,transparent);border-color:var(--oro)}
.bt:active{transform:translateY(1px)}
.bt.pri{background:linear-gradient(180deg,#E6D3A3,#C9B27C 60%,#B39A5C);border-color:#C9B27C;color:#0B0A08;font-weight:600}
.bt.pri:hover{filter:brightness(1.07)}
.bt.fan{border-color:transparent;background:none;color:var(--tinta2)}
.bt.fan:hover{color:var(--oro2);background:var(--hilo3)}
.bt.ch{min-height:30px;padding:4px 11px;font-size:12px}
.bt.ico{padding:0;width:36px}
.bt.ch.ico{width:30px}
.bt.pel{border-color:color-mix(in srgb,var(--terra) 60%,transparent);color:var(--terra2);background:none}
.bt[disabled]{opacity:.4;pointer-events:none}

.modo{display:flex;border:1px solid var(--hilo);flex:none}
.modo button{background:none;border:0;padding:7px 13px;font-size:12.5px;letter-spacing:.05em;color:var(--apag);white-space:nowrap;transition:background .3s,color .3s}
.modo button:hover{color:var(--tinta)}
.modo button.on{background:color-mix(in srgb,var(--oro) 16%,transparent);color:var(--oro2)}
.selaud>button[disabled]{opacity:1}
.fic{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 26px;margin-top:16px;padding-top:16px;border-top:1px solid var(--hilo2)}
.fic .doc{grid-column:1/-1;border:1px solid var(--hilo);padding:14px 16px;background:color-mix(in srgb,var(--oro) 6%,transparent)}
.fic p{margin:6px 0 0;font-size:15px;color:var(--tinta)}
.fic .doc p{font:400 19px/1.35 var(--serif)}
.nor{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--hilo3);align-items:baseline}
.nor b{font:400 24px var(--serif);color:var(--oro2);font-variant-numeric:tabular-nums}
.nor span{font-size:15.5px;line-height:1.35}
.nor small{display:block;font-size:13.5px;color:var(--apag);margin-top:3px}
.nota .bl.lr{background:rgba(20,70,40,.14);border-color:#1f5a3a}
.nota .exp{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;margin-top:10px;padding:6px 8px;border:1px solid rgba(0,0,0,.4);background:rgba(0,0,0,.06);color:#17140D;font-size:12.5px;letter-spacing:.03em}
.nota .exp:hover{background:rgba(0,0,0,.16)}
/* hilo del ciclo */
.ciclo{position:relative;display:flex;align-items:stretch;gap:0;padding:9px var(--lado2) 0 var(--lado);border-bottom:1px solid var(--hilo2);overflow-x:auto;scrollbar-width:none;background:color-mix(in srgb,var(--fondo2) 70%,transparent)}
.ciclo::-webkit-scrollbar{display:none}
.ciclo a{position:relative;flex:1 0 auto;display:flex;flex-direction:column;gap:3px;padding:16px 18px 14px 0;min-width:104px;text-decoration:none;color:var(--apag);transition:color .4s}
.ciclo a:before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--hilo2)}
.ciclo a:after{content:"";position:absolute;left:0;top:-3px;width:7px;height:7px;border:1px solid var(--apag2);background:var(--fondo);transform:rotate(45deg);transition:background .4s,border-color .4s,transform .5s var(--ease)}
.ciclo a b{font:400 16px/1.2 var(--serif);color:inherit;white-space:nowrap}
.ciclo a span{font-size:11.5px;letter-spacing:.04em;color:var(--apag2);white-space:nowrap;font-variant-numeric:tabular-nums}
.ciclo a:hover{color:var(--tinta)}
.ciclo a.on{color:var(--oro2)}
.ciclo a.on:after{background:var(--oro);border-color:var(--oro);transform:rotate(45deg) scale(1.25)}
.ciclo a.hecho:after{border-color:var(--oro)}
.ciclo a.spr:before{background:var(--hilo)}
.ciclo .grp{flex:0 0 auto;align-self:center;margin:0 16px 0 0;display:flex;align-items:center;gap:6px;padding:5px 6px 5px 12px;border:1px solid var(--hilo);font-size:12px;color:var(--oro2);white-space:nowrap}
.ciclo .grp select{background:none;border:0;color:var(--oro2);font-size:12.5px;max-width:230px;padding:2px 2px}
.ciclo .grp select option{background:var(--sup);color:var(--tinta)}
#chispa{position:absolute;top:9px;left:0;height:1px;width:120px;background:linear-gradient(90deg,transparent,var(--oro2),transparent);animation:chispa 9s linear infinite;pointer-events:none}
@keyframes chispa{from{transform:translateX(-140px)}to{transform:translateX(100vw)}}

/* vista */
main{flex:1;padding:34px var(--lado2) 70px var(--lado);max-width:1500px;width:100%;margin:0 auto;min-width:0}
.vt{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:26px}
.vt h1{font:400 clamp(26px,3.1vw,40px)/1.12 var(--serif);letter-spacing:-.005em;max-width:21em;text-wrap:balance;flex:1 1 420px;min-width:0}
.vt h1 em{font-style:italic;color:var(--oro2)}
.vt .her{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-left:auto}
.entra>*{animation:sube .8s var(--ease) both}
.entra>*:nth-child(2){animation-delay:.06s}.entra>*:nth-child(3){animation-delay:.12s}.entra>*:nth-child(4){animation-delay:.18s}.entra>*:nth-child(5){animation-delay:.24s}.entra>*:nth-child(n+6){animation-delay:.3s}
@keyframes sube{from{opacity:0;transform:translateY(16px)}}
.g{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.panel{position:relative;background:var(--tarj);border:1px solid var(--hilo2);padding:22px 24px;min-width:0}
.panel:before{content:"";position:absolute;left:-1px;top:-1px;width:54px;height:2px;background:var(--c,var(--oro))}
.panel.ok{--c:var(--salvia)}.panel.te{--c:var(--terra)}.panel.ac{--c:var(--acero)}
.panel h2{font:400 22px/1.2 var(--serif);margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.panel h2 .der{margin-left:auto;display:flex;gap:6px;align-items:center}
.rot{font:600 11.5px/1.3 var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--oro)}
.apag{color:var(--apag)}
.sep{height:1px;background:var(--hilo2);margin:18px 0}

/* campos */
.cmp{display:block;min-width:0}
.cmp>span{display:block;font:600 11px/1.3 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--apag);margin-bottom:5px}
.in,textarea.in,select.in{width:100%;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--hilo2);padding:6px 0;color:var(--tinta);font-size:15px;line-height:1.45;border-radius:0;transition:border-color .3s}
textarea.in{resize:none;min-height:34px;display:block;overflow:hidden}
.in:hover{border-color:var(--hilo)}
.in:focus{outline:0;border-color:var(--oro)}
.in::placeholder{color:var(--apag2)}
select.in{appearance:none;-webkit-appearance:none;padding-right:18px;background-image:linear-gradient(45deg,transparent 50%,var(--oro) 50%),linear-gradient(135deg,var(--oro) 50%,transparent 50%);background-position:calc(100% - 9px) 55%,calc(100% - 4px) 55%;background-size:5px 5px;background-repeat:no-repeat}
select.in option{background:var(--sup);color:var(--tinta)}
input[type=date].in{min-height:34px}
.in.gr{font:400 26px/1.25 var(--serif)}
.in.md{font:400 19px/1.3 var(--serif)}

/* rejilla editable */
.rej{width:100%;border-collapse:collapse;font-size:14px}
.rejc{overflow-x:auto;margin:0 -4px;padding:0 4px}
.rej th{font:600 11px/1.3 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--oro);text-align:left;padding:10px 12px 10px 0;border-bottom:1px solid var(--hilo);white-space:nowrap}
.rej td{padding:5px 12px 5px 0;border-bottom:1px solid var(--hilo3);vertical-align:top}
.rej td .in{border-bottom-color:transparent;font-size:14px;padding:5px 0}
.rej td .in:hover{border-bottom-color:var(--hilo2)}
.rej td .in:focus{border-bottom-color:var(--oro)}
.rej td textarea.in{min-height:32px;height:32px;resize:none;overflow:hidden}
.rej tr:hover td{background:var(--hilo3)}
.rej td.x{width:30px;padding-right:0;text-align:right}
.rej td.x button{opacity:0;background:none;border:0;color:var(--apag);width:28px;height:30px;transition:opacity .2s,color .2s}
.rej tr:hover td.x button,.rej td.x button:focus-visible{opacity:1}
.rej td.x button:hover{color:var(--terra2)}
.rej td.cod{font:400 15px var(--serif);color:var(--oro2);white-space:nowrap;padding-top:10px}
.vacio{padding:26px 0;color:var(--apag);font-size:15px}
.mas{margin-top:12px}

/* píldoras */
.pil{display:inline-flex;align-items:center;gap:7px;padding:2px 10px;border:1px solid var(--c,var(--hilo));color:var(--c2,var(--tinta2));font-size:12px;letter-spacing:.04em;white-space:nowrap;line-height:1.6}
.pil:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c,var(--oro))}
.pil.ok{--c:var(--salvia);--c2:var(--salvia2)}.pil.te{--c:var(--terra);--c2:var(--terra2)}.pil.ac{--c:var(--acero);--c2:var(--acero2)}.pil.or{--c:var(--oro);--c2:var(--oro2)}.pil.gr{--c:var(--apag2);--c2:var(--apag)}
.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1px solid var(--pc,var(--oro));color:var(--pc,var(--oro2));font:600 10.5px var(--sans);letter-spacing:.04em;flex:none;background:color-mix(in srgb,var(--pc,var(--oro)) 10%,transparent)}
.av.g{width:40px;height:40px;font-size:13px}
:root[data-tema="claro"] .av{color:var(--tinta)}

/* cifras */
.cif{display:flex;flex-direction:column;gap:4px;min-width:0}
.cif b{font:400 clamp(34px,4vw,54px)/1 var(--serif);font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#F3E6C4 0%,#C9B27C 55%,#9C8550 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-tema="claro"] .cif b{background:linear-gradient(180deg,#8A6F2E,#5C4716);-webkit-background-clip:text;background-clip:text}
.cif b small{font-size:.42em;color:var(--apag);-webkit-text-fill-color:var(--apag);margin-left:4px}
.cif span{font-size:13px;color:var(--tinta2);line-height:1.35}
.cif.te b{background:none;color:var(--terra2);-webkit-text-fill-color:var(--terra2)}
.cif.ok b{background:none;color:var(--salvia2);-webkit-text-fill-color:var(--salvia2)}
.barra{position:relative;height:6px;background:var(--hilo3);overflow:hidden}
.barra i{position:absolute;left:0;top:0;bottom:0;width:var(--v,0%);background:linear-gradient(90deg,var(--oro3),var(--oro2));transition:width 1.1s var(--ease)}
.barra.te i{background:linear-gradient(90deg,var(--terra),var(--terra2))}
.barra.ok i{background:linear-gradient(90deg,var(--salvia),var(--salvia2))}

@keyframes ancho{from{width:0}}
.entra .barra i{animation:ancho 1.2s var(--ease) .25s both}
.rej tr.venc td:first-child{box-shadow:inset 2px 0 var(--terra)}
/* inicio */
.heroe{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:34px;align-items:center;margin-bottom:26px}
.heroe h1{font:400 clamp(30px,4vw,56px)/1.06 var(--serif);letter-spacing:-.01em;text-wrap:balance}
.heroe h1 em{font-style:italic;color:var(--oro2)}
.heroe p{font-size:17px;color:var(--tinta2);max-width:34em;margin-top:16px;font-weight:300;line-height:1.5}
.heroe .her{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.rueda{width:100%;height:auto;display:block;overflow:visible}
.rueda text{font-family:var(--sans)}
.rueda .et{font:400 15px var(--serif);fill:var(--tinta2);cursor:pointer;transition:fill .3s}
.rueda .et:hover{fill:var(--oro2)}
.rueda .sub{font-size:11px;fill:var(--apag);letter-spacing:.03em}
.rueda .nd{fill:var(--fondo);stroke:var(--oro);stroke-width:1.2}
.rueda .nd.h{fill:var(--oro)}
.rueda .gira{transform-box:fill-box;transform-origin:center;animation:gi 70s linear infinite}
.rueda .gira2{transform-box:fill-box;transform-origin:center;animation:gi 110s linear infinite reverse}
@keyframes gi{to{transform:rotate(360deg)}}
.fluye{stroke-dasharray:2 9;animation:fl 2.6s linear infinite}
@keyframes fl{to{stroke-dashoffset:-44}}
.sig{display:flex;flex-direction:column}
.sig a{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:start;padding:13px 0;border-top:1px solid var(--hilo3);text-decoration:none;color:var(--tinta);font-size:15px;line-height:1.4;transition:padding .4s var(--ease)}
.sig a:first-child{border-top:0}
.sig a:hover{padding-left:8px}
.sig a i{width:8px;height:8px;margin-top:7px;border:1px solid var(--c,var(--oro));transform:rotate(45deg);background:color-mix(in srgb,var(--c,var(--oro)) 30%,transparent)}
.sig a.te{--c:var(--terra)}.sig a.ok{--c:var(--salvia)}.sig a.ac{--c:var(--acero)}
.sig a u{text-decoration:none;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--apag);white-space:nowrap;padding-top:3px}
.sig a:hover u{color:var(--oro2)}

/* lienzo */
.lienzo{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.lienzo .panel{grid-column:span 2}
.lienzo .a3{grid-column:span 3}.lienzo .a4{grid-column:span 4}.lienzo .a6{grid-column:span 6}
.pers{display:grid;grid-template-columns:44px minmax(0,1.4fr) minmax(0,1fr) 128px 30px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--hilo3)}
.pers:first-of-type{border-top:0}
.pers button.x{background:none;border:0;color:var(--apag);opacity:0}
.pers:hover button.x{opacity:1}
.pers button.av{cursor:pointer}

/* backlog */
.bk{display:flex;flex-direction:column}
.bkf{display:grid;grid-template-columns:26px 62px minmax(0,2.4fr) minmax(0,1.5fr) 96px 70px 44px 132px 116px;gap:12px;align-items:center;padding:10px 6px;border-top:1px solid var(--hilo3);cursor:pointer;transition:background .25s;position:relative}
.bkf.cabz{cursor:default;border-top:0;border-bottom:1px solid var(--hilo);padding-top:0}
.bkf.cabz span{font:600 11px/1.3 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--oro)}
.bkf:not(.cabz):hover{background:var(--hilo3)}
.bkf .ag{color:var(--apag2);cursor:grab;display:grid;place-items:center;touch-action:none}
.bkf .cd{font:400 15px var(--serif);color:var(--oro2)}
.bkf .ti{min-width:0;font-size:15px;line-height:1.35}
.bkf .ri{min-width:0;font-size:13px;color:var(--apag);line-height:1.35}
.bkf select.in{font-size:13px;border-bottom-color:transparent}
.bkf.arr{opacity:.35}
.bkf.fin .ti{color:var(--apag)}
.linea-ins{height:2px;background:var(--oro);margin:-1px 0}
.chk{display:flex;gap:12px;align-items:flex-start;padding:7px 0;font-size:14.5px;line-height:1.4;color:var(--tinta2);cursor:pointer}
.chk input[type=checkbox]{position:absolute;opacity:0;pointer-events:none}
.chk i{width:20px;height:20px;border:1.3px solid var(--oro);display:grid;place-items:center;flex:none;margin-top:1px;transition:background .3s}
.chk i svg{width:12px;height:12px;stroke:var(--sobreoro);stroke-width:2.2;fill:none;stroke-dasharray:16;stroke-dashoffset:16;transition:stroke-dashoffset .35s var(--ease)}
.chk input:checked+i{background:var(--oro)}
.chk input:checked+i svg{stroke-dashoffset:0}
.chk.ed label{display:flex;cursor:pointer}
.chk.ed{align-items:center}
.chk input:focus-visible+i{outline:1.5px solid var(--oro2);outline-offset:2px}
.chk.ed{cursor:default}
.chk.ed .in{padding:0 0 3px;font-size:14.5px}
.chk.ed button{background:none;border:0;color:var(--apag);opacity:0}
.chk.ed:hover button{opacity:1}

/* capacidad */
.capf{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 0;border-top:1px solid var(--hilo3)}
.capf:first-of-type{border-top:0}
.capf .nm{font-size:15px;display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}
.capf .nm small{color:var(--apag);font-size:12.5px}
.capf .dias{font:400 22px var(--serif);font-variant-numeric:tabular-nums;white-space:nowrap}
.capf .dias small{font:400 12px var(--sans);color:var(--apag)}
.mini{display:grid;grid-template-columns:54px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--hilo3);font-size:14.5px}
.mini:first-of-type{border-top:0}
.mini .cd{font:400 15px var(--serif);color:var(--oro2)}
.mini .ti{min-width:0;cursor:pointer}
.mini .ti:hover{color:var(--oro2)}
.mini.spl{grid-template-columns:34px minmax(0,1fr) 120px auto}

/* tablero */
.tab{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;align-items:start;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.col{position:relative;border:1px solid var(--hilo2);background:rgba(255,255,255,.02);min-height:340px;display:flex;flex-direction:column;scroll-snap-align:start;transition:border-color .3s,background .3s}
:root[data-tema="claro"] .col{background:rgba(255,255,255,.45)}
.col>header{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.col>header b{font:600 12px var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--oro)}
.col>header .ct{margin-left:auto;font:400 15px var(--serif);color:var(--tinta2);font-variant-numeric:tabular-nums;white-space:nowrap}
.col>header .ct select.in{color:var(--oro2);font-family:var(--sans)}
.col .cu{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(208px,1fr));align-content:start;align-items:start;gap:12px;padding:6px 14px 18px;min-height:120px}
.col.sobre{border-color:var(--oro);background:color-mix(in srgb,var(--oro) 6%,transparent)}
.col.exc{border-color:var(--terra)}
.col.exc>header .ct{color:var(--terra2)}
.col.no{animation:tiembla .5s var(--ease)}
@keyframes tiembla{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.nota{position:relative;padding:13px 14px 12px;color:var(--n-tinta);font:500 14.5px/1.3 var(--sans);box-shadow:var(--sombra);background:linear-gradient(180deg,var(--n1,var(--n-oro1)),var(--n2,var(--n-oro2)));cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-y;transition:transform .35s var(--ease),box-shadow .35s}
.nota:hover{transform:translateY(-2px) rotate(-.4deg)}
.nota.vd{--n1:var(--n-vd1);--n2:var(--n-vd2)}.nota.az{--n1:var(--n-az1);--n2:var(--n-az2)}.nota.t{--n1:var(--n-te1);--n2:var(--n-te2)}.nota.gr{--n1:var(--n-gr1);--n2:var(--n-gr2)}
.nota .c{display:flex;align-items:center;gap:8px;font:600 11px var(--sans);letter-spacing:.18em;opacity:.72;margin-bottom:5px}
.nota .c u{text-decoration:none;margin-left:auto;letter-spacing:.04em;font-weight:500}
.nota .p{display:flex;align-items:center;gap:8px;margin-top:10px}
.nota .p .q{flex:1;height:3px;background:rgba(0,0,0,.14);position:relative}
.nota .p .q i{position:absolute;left:0;top:0;bottom:0;background:rgba(0,0,0,.62);width:var(--v,0%);transition:width .6s var(--ease)}
.nota .p .a{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.45);display:grid;place-items:center;font:600 10px var(--sans);flex:none}
.nota .p small{font-size:11px;opacity:.75;font-variant-numeric:tabular-nums}
.nota .bl{display:block;margin-top:8px;padding:4px 8px;background:rgba(120,30,10,.16);border-left:2px solid #7a2a17;font-size:12px;line-height:1.3}
.nota .mv{position:absolute;right:8px;top:-12px;display:none;gap:1px;box-shadow:0 6px 14px rgba(0,0,0,.35)}
.nota .mv button{width:28px;height:24px;border:0;background:#17140D;color:#EADBAA;display:grid;place-items:center}
.nota .mv button:hover{background:#2A2618}
.nota:hover .mv,.nota:focus .mv,.nota:focus-within .mv,.tactil .nota .mv{display:flex}
.tactil .nota .mv button{width:40px;height:34px}
.tactil .nota .mv{top:-16px}
.nota.arr{opacity:.25}
.nota.tenue{opacity:.28}
.fant{position:fixed;z-index:80;pointer-events:none;transform:rotate(2.2deg) scale(1.04);box-shadow:0 30px 50px rgba(0,0,0,.6);margin:0;transition:none}
.hueco{border:1px dashed var(--oro);height:64px;background:color-mix(in srgb,var(--oro) 6%,transparent)}
.filt{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filt .av{cursor:pointer;transition:transform .3s var(--ease),opacity .3s}
.filt .av:hover{transform:scale(1.1)}
.filt.hay .av:not(.on){opacity:.35}
.filt .av.exc{box-shadow:0 0 0 2px var(--terra)}

/* cajón */
#velo{position:fixed;inset:0;background:var(--velo);backdrop-filter:blur(5px);z-index:60;opacity:0;pointer-events:none;transition:opacity .4s}
#velo.on{opacity:1;pointer-events:auto}
.caj{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:61;background:linear-gradient(180deg,var(--sup),var(--fondo2));border-left:1px solid var(--hilo);box-shadow:var(--sombra2);transform:translateX(104%);visibility:hidden;transition:transform .6s var(--ease),visibility 0s .6s;display:flex;flex-direction:column}
.caj.on{transform:none;visibility:visible;transition:transform .6s var(--ease),visibility 0s}
.caj>header{display:flex;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid var(--hilo2)}
.caj>header b{font:400 20px var(--serif);color:var(--oro2)}
.caj>header .der{margin-left:auto;display:flex;gap:6px}
.caj .cu{flex:1;overflow-y:auto;padding:20px 24px 30px;display:flex;flex-direction:column;gap:16px}
.caj .f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.caj .f3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.caj h3{font:600 11.5px var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--oro);display:flex;align-items:center;gap:10px;margin-top:6px}
.caj h3 span{margin-left:auto;color:var(--apag);letter-spacing:.04em;font-weight:400;text-transform:none;font-size:12.5px}
.hist{font-size:13px;color:var(--apag);line-height:1.7}
.hist b{color:var(--tinta2);font-weight:400}

/* ventana */
.mod{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:20px;background:var(--velo);backdrop-filter:blur(6px);animation:apa .35s both}
@keyframes apa{from{opacity:0}}
.mod>div{position:relative;width:min(640px,100%);max-height:calc(100vh - 40px);overflow-y:auto;background:linear-gradient(180deg,var(--sup),var(--fondo2));border:1px solid var(--hilo);padding:38px 42px 34px;box-shadow:var(--sombra2);animation:sube .6s var(--ease) both}
.mod>div:before{content:"";position:absolute;left:42px;top:0;width:80px;height:2px;background:var(--oro)}
.mod.an>div{width:min(880px,100%)}
.mod h2{font:400 30px/1.15 var(--serif);margin-bottom:10px;text-wrap:balance}
.mod p{color:var(--tinta2);font-size:15.5px;line-height:1.5;margin-bottom:8px}
.mod .pie{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;flex-wrap:wrap}
.mod .cer{position:absolute;right:16px;top:14px}
.menu{position:absolute;z-index:50;min-width:270px;background:linear-gradient(180deg,var(--sup2),var(--sup));border:1px solid var(--hilo);box-shadow:var(--sombra2);padding:6px;animation:sube .35s var(--ease) both}
.menu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:10px 12px;font-size:14px;color:var(--tinta)}
.menu button small{display:block;font-size:12px;color:var(--apag)}
.menu button:hover{background:var(--hilo3);color:var(--oro2)}
.menu hr{border:0;border-top:1px solid var(--hilo2);margin:5px 0}
.menu .rot{padding:10px 12px 4px}
.exps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}
.exps button{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;background:var(--tarj);border:1px solid var(--hilo2);padding:18px 18px 16px;transition:border-color .3s,transform .4s var(--ease)}
.exps button:hover{border-color:var(--oro);transform:translateY(-2px)}
.exps button b{font:400 19px var(--serif);color:var(--tinta)}
.exps button span{font-size:13px;color:var(--apag);line-height:1.4}
.exps button svg{color:var(--oro);width:22px;height:22px}

/* avisos */
#avisos{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(560px,calc(100% - 32px))}
.avi{pointer-events:none;display:flex;align-items:center;gap:14px;padding:12px 16px 12px 18px;background:var(--sup2);border:1px solid var(--hilo);box-shadow:var(--sombra2);font-size:14px;line-height:1.4;animation:sube .5s var(--ease) both;max-width:100%}
.avi.te{border-color:var(--terra)}
.avi.ok{border-color:var(--salvia)}
.avi button{flex:none;pointer-events:auto}
.caj.on~#avisos{bottom:auto;top:calc(16px + env(safe-area-inset-top,0px))}
.avi.sale{opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}

/* daily */
.reloj{position:relative;width:210px;height:210px;flex:none}
.reloj svg{width:100%;height:100%;transform:rotate(-90deg)}
.reloj circle{fill:none;stroke-width:2}
.reloj .f{stroke:var(--hilo2)}
.reloj .p{stroke:var(--oro);stroke-linecap:butt;transition:stroke-dashoffset 1s linear}
.reloj.fin .p{stroke:var(--terra)}
.reloj div{position:absolute;inset:0;display:grid;place-items:center;font:400 52px var(--serif);font-variant-numeric:tabular-nums}
.turnos{display:flex;gap:10px;flex-wrap:wrap}
.turno{display:flex;align-items:center;gap:10px;padding:7px 14px 7px 7px;border:1px solid var(--hilo2);background:none;font-size:14px;transition:border-color .3s,background .3s}
.turno.on{border-color:var(--oro);background:color-mix(in srgb,var(--oro) 8%,transparent)}
.turno.visto{opacity:.5}
.preg{font:400 21px/1.3 var(--serif);color:var(--tinta);margin:14px 0 6px}

/* retro */
.retro{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.retro .col{min-height:260px}
.retro .nota{cursor:default;font-size:14px}
.retro .nota textarea{width:100%;background:none;border:0;color:inherit;font:inherit;resize:none;outline:0;min-height:42px;overflow:hidden}
.retro .nota .vt2{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px}
.retro .nota .vt2 button{background:rgba(0,0,0,.1);border:0;color:#17140D;padding:3px 9px;font-size:12px}
.retro .nota .vt2 button:hover{background:rgba(0,0,0,.2)}
.retro .nota .vt2 .x{margin-left:auto}
.retro .nota .vt2 .num{white-space:nowrap}
.agn{display:flex;gap:8px;padding:0 14px 14px}
.agn input{flex:1;min-width:0}

/* gráficas */
.graf{width:100%;height:auto;display:block;overflow:visible}
.graf text{font-family:var(--sans);font-size:11px;fill:var(--apag)}
.graf .ej{stroke:var(--hilo2);stroke-width:1}
.graf .plan{stroke:var(--apag2);stroke-width:1.2;stroke-dasharray:4 5;fill:none}
.graf .real{stroke:var(--oro);stroke-width:2;fill:none;stroke-linejoin:round}
.graf .area{fill:url(#gOro);opacity:.5}
.graf .pt{fill:var(--fondo);stroke:var(--oro2);stroke-width:1.5}
.graf .hoyl{stroke:var(--hilo);stroke-width:1;stroke-dasharray:2 4}
.graf .bar{fill:var(--oro);opacity:.85}
.graf .bar.g{fill:var(--hilo2)}
.traza{stroke-dasharray:var(--l,1000);stroke-dashoffset:var(--l,1000);animation:traza 1.8s var(--ease) .2s forwards}
@keyframes traza{to{stroke-dashoffset:0}}
.crece{transform-box:fill-box;transform-origin:bottom;animation:crece 1s var(--ease) both}
@keyframes crece{from{transform:scaleY(0)}}
.ley{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--apag);margin-top:10px}
.ley i{display:inline-block;width:18px;height:0;border-top:2px solid var(--oro);vertical-align:middle;margin-right:7px}
.ley i.p{border-top:1.2px dashed var(--apag2)}
.flujo{display:flex;height:34px;gap:2px}
.flujo div{display:grid;place-items:center;font-size:12.5px;color:var(--n-tinta);min-width:26px;transition:flex 1s var(--ease);font-variant-numeric:tabular-nums}

/* demostración */
#demo{position:fixed;left:0;right:0;bottom:0;z-index:95;padding:16px var(--lado2) calc(16px + env(safe-area-inset-bottom,0px)) var(--lado);background:linear-gradient(180deg,transparent,var(--fondo) 34%);display:flex;justify-content:center;pointer-events:none}
#demo>div{pointer-events:auto;display:flex;align-items:center;gap:18px;width:min(1040px,100%);padding:16px 18px 16px 24px;background:var(--sup2);border:1px solid var(--oro);box-shadow:var(--sombra2)}
#demo .tx{flex:1;min-width:0;font:400 clamp(17px,1.7vw,23px)/1.3 var(--serif);color:var(--tinta)}
#demo .tx em{font-style:italic;color:var(--oro2)}
#demo .n{font:400 14px var(--serif);color:var(--apag);white-space:nowrap;font-variant-numeric:tabular-nums}
#demo .ct{display:flex;gap:6px}
.foco{position:relative;z-index:2;box-shadow:0 0 0 1px var(--oro),0 0 0 9px color-mix(in srgb,var(--oro) 12%,transparent)!important;transition:box-shadow .6s var(--ease)}
body.demo main{padding-bottom:150px}
body.demo #avisos{bottom:calc(132px + env(safe-area-inset-bottom,0px))}

/* compartir */
.comp{display:grid;grid-template-columns:auto minmax(0,1fr);gap:30px;align-items:center}
.qr{background:#FBF9F4;padding:14px;line-height:0;width:232px}
.qr svg{width:100%;height:auto;display:block}
.dir{display:flex;gap:8px;margin-top:14px}
.dir input{flex:1;min-width:0}

/* pie */
.pie-p{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:18px var(--lado2) calc(18px + env(safe-area-inset-bottom,0px)) var(--lado);border-top:1px solid var(--hilo2);font-size:12.5px;color:var(--apag);position:relative;z-index:1}
.pie-p a{color:var(--tinta2);text-decoration:none;display:inline-flex;align-items:center;gap:7px}
.pie-p a:hover{color:var(--oro2)}
.pie-p .fi{font-size:11.5px;letter-spacing:.3em;text-transform:uppercase}
.pie-p .de{margin-left:auto}

/* informe para imprimir */
#impr{display:none}

@media (max-width:1080px){
  .heroe{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g21,.g12{grid-template-columns:1fr}
  .lienzo .panel,.lienzo .a3,.lienzo .a4{grid-column:span 3}
  .bkf{grid-template-columns:26px 54px minmax(0,1fr) 92px 44px 132px}
  .bkf .ri,.bkf .es,.bkf .li{display:none}
}
@media (max-width:720px){
  body{font-size:15px}
  main{padding-top:22px}
  .cab{gap:10px;flex-wrap:wrap}
  .marca b{font-size:18px}
  .selaud{order:3;flex-basis:100%;max-width:none}
  .modo{order:2}
  .fic{grid-template-columns:1fr}
  .selaud>button{border-left:0;padding-left:0}
  .acc .tx{display:none}
  .acc .bt{padding:0;width:38px}
  .g2,.g3,.g4,.retro,.exps,.caj .f3{grid-template-columns:1fr}
  .lienzo{grid-template-columns:1fr}
  .lienzo .panel,.lienzo .a3,.lienzo .a4,.lienzo .a6{grid-column:auto}
  .panel{padding:18px 16px}
  .bkf{grid-template-columns:48px minmax(0,1fr) 40px;gap:10px}
  .bkf .ag,.bkf .pr,.bkf .sp{display:none}
  .pers{grid-template-columns:40px minmax(0,1fr) 30px}
  .pers .rl,.pers .cp{grid-column:2}
  .tab{grid-auto-columns:82%}
  .comp{grid-template-columns:1fr;justify-items:center}
  .mod>div{padding:32px 22px 24px}
  .mod>div:before{left:22px}
  #demo>div{flex-wrap:wrap;gap:10px;padding:14px}
  .reloj{width:150px;height:150px}.reloj div{font-size:38px}
  .mini{grid-template-columns:46px minmax(0,1fr) auto}
  .mini .op{display:none}
  .rej{min-width:560px}
  .mini.spl{grid-template-columns:28px minmax(0,1fr) auto}.mini.spl .barra{display:none}
  .sig a{grid-template-columns:22px minmax(0,1fr)}.sig a u{display:none}
  .rueda .et{font-size:20px}.rueda .sub{font-size:14.5px}
  .heroe{gap:10px}
}
@media print{
  :root,:root[data-tema]{color-scheme:light;--fondo:#fff;--fondo2:#fff;--sup:#fff;--sup2:#fff;--tinta:#111;--tinta2:#333;--apag:#555;--apag2:#888;--oro:#7A6226;--oro2:#5C4716;--hilo:#B9A873;--hilo2:#CCC;--hilo3:#E6E6E6}
  @page{size:letter landscape;margin:14mm}
  body{background:#fff;font-size:10.5pt}
  #app,#fondo,#avisos,#demo,#velo,.caj,.mod{display:none!important}
  #impr{display:block;color:#111}
  #impr h1{font:400 24pt/1.1 var(--serif);margin-bottom:4pt}
  #impr h2{font:400 15pt var(--serif);margin:16pt 0 6pt;padding-top:8pt;border-top:1.5pt solid #7A6226;break-after:avoid}
  #impr .meta{font-size:9.5pt;color:#555;margin-bottom:10pt}
  #impr table{width:100%;border-collapse:collapse;font-size:9.5pt;margin-bottom:6pt}
  #impr th{text-align:left;font-size:7.5pt;letter-spacing:.14em;text-transform:uppercase;color:#7A6226;border-bottom:1pt solid #7A6226;padding:4pt 6pt 4pt 0}
  #impr td{padding:4pt 6pt 4pt 0;border-bottom:.5pt solid #ccc;vertical-align:top}
  #impr tr{break-inside:avoid}
  #impr .kp{display:grid;grid-template-columns:repeat(5,1fr);gap:10pt;margin:8pt 0 4pt}
  #impr .kp div b{display:block;font:400 22pt var(--serif);color:#5C4716}
  #impr .kp div span{font-size:8.5pt;color:#444}
  #impr .fir{display:grid;grid-template-columns:1fr 1fr;gap:40pt;margin-top:34pt;break-inside:avoid}
  #impr .fir div{border-top:.8pt solid #111;padding-top:4pt;font-size:9pt}
  #impr .pp{margin-top:14pt;font-size:8pt;color:#777}
}

  return cab('El lienzo recoge los objetivos, los riesgos y lo que la Alta Dirección espera de la auditoría') +
    `<div class="lienzo">
      <div class="panel a4">${campo('Auditoría', 'nombre', a.nombre, { cl: 'gr' })}<div style="height:14px"></div>${campo('Objetivo de la auditoría', 'lienzo.objetivo', l.objetivo, { area: 1 })}<div style="height:14px"></div>${campo('Alcance', 'lienzo.alcance', l.alcance, { area: 1 })}</div>
      <div class="panel"><div class="g" style="gap:14px">${campo('Fecha de realización', 'lienzo.fecha', l.fecha, { tipo: 'date' })}${campo('Periodo de cobertura', 'lienzo.periodo', l.periodo)}${campo('Jefe de la Oficina de Control Interno', 'lienzo.jefe', l.jefe)}${campo('Alta Dirección que participa', 'lienzo.alta', l.alta)}${campo('Backlog aprobado por', 'lienzo.aprobo', l.aprobo || '')}${campo('Fecha de aprobación', 'lienzo.faprob', l.faprob || '', { tipo: 'date' })}</div></div>
      ${LIENZO.map(q => `<div class="panel"><label class="cmp"><span style="font:400 18px/1.3 var(--serif);letter-spacing:0;text-transform:none;color:var(--tinta);margin-bottom:10px">${q[1]}</span><textarea class="in" rows="3" data-b="lienzo.${q[0]}">${esc(l[q[0]])}</textarea></label></div>`).join('')}
      <div class="panel a3"><h2>Roles y equipo<span class="der"><button class="bt ch" data-a="masPersona">${ic('mas')}Persona</button></span></h2>
        <div class="pers" style="border:0;padding:0 0 4px"><span></span><span class="rot">Nombre o cargo</span><span class="rot rl">Rol</span><span class="rot cp" title="Iniciales y días disponibles por sprint">Iniciales · Días</span><span></span></div>${pers}</div>
      <div class="panel a3"><h2>Sprints<span class="der"><button class="bt ch" data-a="masSprint">${ic('mas')}Sprint</button></span></h2>
        ${rejilla(a.sprints, 'sprints', [['nombre', 'Nombre', 'txt', '', null, 'Nombre del sprint'], ['objetivo', 'Objetivo', 'txt', '34%'], ['ini', 'Inicio', 'fecha', '128px'], ['fin', 'Fin', 'fecha', '128px']])}
        <div class="sep"></div><div class="g g2">${campo('Valor de hacerla con agilismo', 'lienzo.valorAgil', l.valorAgil, { area: 1 })}${campo('Cómo se mide el éxito', 'lienzo.exito', l.exito, { area: 1 })}</div><div style="height:14px"></div>${campo('Informes de ley que debe entregar la auditoría', 'lienzo.ley', l.ley || '', { area: 1, filas: 1 })}</div>
      <div class="panel a6 ac"><h2>Reconocimiento y apertura<span class="der"><button class="bt ch" data-a="masRecon">${ic('mas')}Reunión</button></span></h2>
        ${rejilla(a.recon, 'recon', [['fecha', 'Fecha', 'fecha', '128px'], ['con', 'Con quién', 'txt', '24%'], ['tema', 'Qué se entendió del proceso', 'txt']], { vacio: 'Sin reuniones de reconocimiento registradas. Son las conversaciones con los líderes del proceso antes de la reunión de apertura.' })}
        <div class="sep"></div><div class="g g2">${campo('Fecha de la reunión de apertura', 'lienzo.fapertura', l.fapertura || '', { tipo: 'date' })}${campo('Acta de apertura', 'lienzo.acta', l.acta || '', { ph: 'Referencia del acta' })}</div></div>
    </div>`;
};

/* ---------- backlog ---------- */
V.backlog = () => {
  const a = A();
  const filas = a.items.map(i => `<div class="bkf ${i.col === 'fin' ? 'fin' : ''}" data-a="abrir" data-id="${i.id}" data-fila="${i.id}" tabindex="0" aria-label="${esc(i.cod + ' ' + i.t)}">
      <span class="ag" data-arr="${i.id}" title="Arrastrar para cambiar la prioridad">${ic('ag')}</span><span class="cd">${esc(i.cod)}</span>
      <span class="ti">${esc(i.t) || '<span class="apag">Sin título</span>'}<br><small class="apag">${esc(i.inc)}</small></span><span class="ri">${esc(i.riesgo)}</span>
      <span class="pr">${selec(`items.#${i.id}.pri`, i.pri, Object.entries(PRI), { et: 'Prioridad' })}</span><span class="es num">${i.dias ? pl(+i.dias, 'día', 'días') : ''}</span>
      ${avatar(i.resp)}<span class="sp">${selec(`items.#${i.id}.sprint`, i.sprint, opSpr(), { et: 'Sprint' })}</span><span class="li">${pilListo(i)}</span></div>`).join('');
  return cab('El backlog detalla la auditoría en microtareas con orden y jerarquía', `<button class="bt" data-a="microIA">${ic('ia')}Microtareas con IA</button><button class="bt pri" data-a="masItem">${ic('mas')}Actividad</button>`) +
    `<div class="panel" style="margin-bottom:18px"><div class="bk"><div class="bkf cabz"><span class="ag"></span><span>Cód.</span><span>Actividad (microtarea) e incremento</span><span class="ri">Riesgo</span><span class="pr">Prioridad</span><span class="es">Plazo</span><span></span><span class="sp">Sprint</span><span class="li">Estado</span></div>${filas || '<div class="vacio">El backlog está vacío. Agregue la primera actividad o pida una propuesta de microtareas a un asistente de IA.</div>'}</div></div>
    <div class="g g12">
      <div class="panel ok"><h2>Definición de terminado</h2>${a.dod.map(d => `<div class="chk ed"><i style="border-color:var(--salvia)"></i><input class="in" data-b="dod.#${d.id}.t" value="${esc(d.t)}" aria-label="Criterio de terminado"><button data-a="quitar" data-l="dod" data-id="${d.id}" aria-label="Quitar criterio">${ic('x')}</button></div>`).join('')}<button class="bt ch mas" data-a="masDod">${ic('mas')}Criterio</button></div>
      <div class="panel"><h2>Control de cambios<span class="der"><button class="bt ch" data-a="masCambio">${ic('mas')}Cambio</button></span></h2>${rejilla(a.cambios, 'cambios', [['fecha', 'Fecha', 'fecha', '128px'], ['cambio', 'Cambio frente a la versión anterior', 'txt'], ['motivo', 'Motivo e impacto', 'txt'], ['aprobo', 'Aprobó', 'txt', '22%']], { vacio: 'Sin cambios registrados. Un cambio al backlog se evalúa, se registra y se aprueba antes de ejecutarlo.' })}</div>
    </div>`;
};

/* ---------- sprint planning ---------- */
V.planning = () => {
  const a = A(), s = sprintVista(); if (!s) return sinSprint();
  const n = sprN(s.id), mios = delSprint(s), fuera = a.items.filter(i => i.sprint !== s.id && i.col === 'no');
  const ant = a.sprints[n - 2], mej = ant ? ant.retro.acciones : [];
  const cap = equipo().map(p => { const as = asignado(p, s), ex = p.cap && as > p.cap; return `<div class="capf">${avatar(p.id, 'g')}<div><div class="nm"><span>${esc(p.nombre || p.ini)}</span>${ex ? `<small style="color:var(--terra2)">Excede la capacidad en ${pl(as - p.cap, 'día', 'días')}</small>` : ''}</div><div class="barra ${ex ? 'te' : ''}" style="--v:${Math.min(100, pct(as, p.cap || as || 1))}%"><i></i></div></div><div class="dias num">${as}<small> de ${pl(+p.cap || 0, 'día', 'días')}</small></div></div>`; }).join('');
  return cab('El sprint incluye solo las tareas que cumplen su definición de listo', chips()) +
    `<div class="g g2" style="margin-bottom:18px">
      <div class="panel">${campo('Sprint ' + n, `sprints.#${s.id}.nombre`, s.nombre, { cl: 'md', ph: 'Nombre del sprint' })}<div style="height:14px"></div>${campo('Objetivo del sprint', `sprints.#${s.id}.objetivo`, s.objetivo, { area: 1 })}<div style="height:14px"></div>
        <div class="g g3">${campo('Inicio', `sprints.#${s.id}.ini`, s.ini, { tipo: 'date' })}${campo('Fin', `sprints.#${s.id}.fin`, s.fin, { tipo: 'date' })}<div class="cmp"><span title="De lunes a viernes, sin descontar festivos">Días de lunes a viernes</span><div class="serif num" style="font-size:26px;line-height:1.3" id="calcHab">${s.ini && s.fin ? habiles(s.ini, s.fin) : ''}</div></div></div></div>
      <div class="panel ac"><h2>Capacidad del equipo</h2>${cap || '<div class="vacio">Agregue al Scrum Team en el lienzo.</div>'}</div>
      <div class="panel" style="grid-column:1/-1"><h2>Acuerdos del equipo</h2><div class="g g4"><label class="cmp"><span>Límite de trabajo en curso</span>${selec('wip.prog', String(a.wip.prog), [['0', 'Sin límite'], ...[1, 2, 3, 4, 5, 6, 8, 10].map(n => [String(n), String(n)])], { attr: ' data-t="n"' })}</label><label class="cmp"><span>Máximo por persona</span>${selec('wip.persona', String(a.wip.persona), [['0', 'Sin límite'], ['1', '1'], ['2', '2'], ['3', '3']], { attr: ' data-t="n"' })}</label>${campo('Hora de la Daily', 'acuerdos.daily', a.acuerdos.daily)}${campo('Dónde se guardan los papeles de trabajo', 'acuerdos.repo', a.acuerdos.repo)}</div></div>
    </div>
    <div class="g g2">
      <div class="panel"><h2>En el sprint ${n}<span class="der apag num" style="font:400 14px var(--sans)">${pl(mios.reduce((t, i) => t + (+i.dias || 0), 0), 'día', 'días')}</span></h2>${mios.map(i => `<div class="mini"><span class="cd">${esc(i.cod)}</span><span class="ti" data-a="abrir" data-id="${i.id}" tabindex="0">${esc(i.t)}</span><span class="op">${pilListo(i)}</span>${i.col === 'no' ? `<button class="bt ch ico fan" data-a="sacar" data-id="${i.id}" title="Devolver al backlog" aria-label="Devolver al backlog">${ic('x')}</button>` : avatar(i.resp)}</div>`).join('') || '<div class="vacio">Este sprint no tiene actividades. Agréguelas desde el backlog.</div>'}</div>
      <div class="panel"><h2>Fuera de este sprint</h2>${fuera.map(i => `<div class="mini"><span class="cd">${esc(i.cod)}</span><span class="ti" data-a="abrir" data-id="${i.id}" tabindex="0">${esc(i.t)}${i.sprint ? ` <small class="apag">· sprint ${sprN(i.sprint)}</small>` : ''}</span><span class="op">${pilListo(i)}</span><button class="bt ch" data-a="meter" data-id="${i.id}">${ic('mas')}Al sprint</button></div>`).join('') || '<div class="vacio">Todas las actividades tienen sprint.</div>'}</div>
      ${mej.length ? `<div class="panel ok" style="grid-column:1/-1"><h2>Mejoras acordadas en la retrospectiva del sprint ${n - 1}</h2>${mej.map(x => `<div class="mini" style="grid-template-columns:minmax(0,1fr) auto auto"><span>${esc(x.t)}</span>${avatar(x.resp)}<span class="pil ${x.ok ? 'ok' : 'or'}">${x.ok ? 'Cumplida' : 'Pendiente'}</span></div>`).join('')}</div>` : ''}
    </div>`;
};
const sinSprint = () => cab('La auditoría todavía no tiene sprints') + `<div class="panel"><div class="vacio">Defina el primer sprint en el lienzo.</div><button class="bt pri" data-a="ir" data-v="lienzo">Abrir el lienzo</button></div>`;

/* ---------- tablero ---------- */
V.tablero = () => {
  const a = A(), s = sprintVista(); if (!s) return sinSprint();
  const eq = equipo(), cuentaP = id => enCol(s, 'prog').filter(i => i.resp === id).length;
  const nota = i => { const blq = a.imped.find(x => x.item === i.id && x.estado !== 'r'), falta = i.col === 'no' && !reqOk(i), k = COLS.findIndex(c => c.id === i.col);
    return `<article class="nota ${i.col === 'prog' ? 'az' : i.col === 'fin' ? 'vd' : ''} ${UI.filtro && i.resp !== UI.filtro ? 'tenue' : ''}" data-nota="${i.id}" data-a="abrir" data-id="${i.id}" tabindex="0" aria-label="${esc(i.cod + ' ' + i.t)}">
      <div class="mv">${k > 0 ? `<button data-a="paso" data-id="${i.id}" data-d="-1" aria-label="Mover a ${COLS[k - 1].n}">${ic('izq')}</button>` : ''}${k < 2 ? `<button data-a="paso" data-id="${i.id}" data-d="1" aria-label="Mover a ${COLS[k + 1].n}">${ic('der')}</button>` : ''}</div>
      <div class="c">${esc(i.cod)}<u>${i.dias ? pl(+i.dias, 'día', 'días') : ''}</u></div>${esc(i.t)}
      ${falta ? `<span class="bl">Falta: ${esc(i.req.filter(r => !r.ok).map(r => r.t).join('; '))}</span>` : ''}${i.col === 'prog' && i.lista && !i.rev ? '<span class="bl lr">Lista para revisión</span>' : ''}${blq && !falta && i.col !== 'fin' ? `<span class="bl">${esc(blq.t)}</span>` : ''}
      <div class="p"><span class="q" style="--v:${pct(dodN(i), a.dod.length)}%"><i></i></span><small>${dodN(i)} de ${a.dod.length} criterios</small><span class="a" title="${esc((per(i.resp) || {}).nombre || 'Sin responsable')}">${esc(ini(i.resp)) || '·'}</span></div></article>`; };
  const cols = COLS.map(c => { const l = enCol(s, c.id), lim = c.id === 'prog' ? a.wip.prog : 0, exc = lim && l.length > lim;
    return `<section class="col ${exc ? 'exc' : ''}" data-col="${c.id}"><header><b>${c.n}</b><span class="ct num">${l.length}${c.id === 'prog' ? ` <span class="apag" style="font:400 12px var(--sans)">máx.</span> ${selec('wip.prog', String(a.wip.prog), [['0', 'Sin límite'], ...[1, 2, 3, 4, 5, 6, 8, 10].map(n => [String(n), String(n)])], { et: 'Límite de trabajo en curso', attr: ' data-t="n" style="width:auto;display:inline-block;font-size:13px;padding:2px 18px 2px 2px"' })}` : ''}</span></header><div class="cu">${l.map(nota).join('')}</div></section>`; }).join('');
  return cab('Una prueba pasa a «en progreso» solo cuando otra termina', chips()) +
    `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px"><div style="min-width:0;flex:1 1 300px"><div class="serif" style="font-size:20px">${esc(s.nombre || 'Sprint ' + sprN(s.id))}</div><div class="apag" style="font-size:13.5px">${esc(s.objetivo)}</div></div>
      <div class="filt ${UI.filtro ? 'hay' : ''}" aria-label="Filtrar por responsable">${eq.map(p => `<button class="av ${UI.filtro === p.id ? 'on' : ''} ${a.wip.persona && cuentaP(p.id) > a.wip.persona ? 'exc' : ''}" style="--pc:${tono(p)}" data-a="filtro" data-id="${p.id}" title="${esc(p.nombre)}: ${cuentaP(p.id)} en progreso" aria-pressed="${UI.filtro === p.id}">${esc(p.ini)}</button>`).join('')}</div>
      <label class="apag" style="font-size:13px;display:flex;gap:8px;align-items:center">Máximo por persona ${selec('wip.persona', String(a.wip.persona), [['0', 'Sin límite'], ['1', '1'], ['2', '2'], ['3', '3']], { et: 'Actividades en progreso por persona', attr: ' data-t="n" style="width:auto;font-size:13px;padding:2px 18px 2px 2px"' })}</label>
      <span class="apag num" style="font-size:13px">Actualizado el ${fLarga(fIso(new Date(a.mod)))}</span>
      <span style="display:flex;gap:8px;flex-wrap:wrap"><button class="bt ch" data-a="tomar" title="Traer al sprint una actividad lista, en orden de prioridad">${ic('baja')}Tomar del backlog</button><button class="bt ch" data-a="masItemSprint">${ic('mas')}Actividad</button></span></div>
    <div class="tab" id="tab">${cols}</div>`;
};

/* ---------- daily ---------- */
V.daily = () => {
  const a = A(), s = sprintActual(); if (!s) return sinSprint();
  const eq = equipo(); if (!UI.daily) UI.daily = { seg: 900, on: false, per: eq[0] && eq[0].id, vistos: {} };
  const D = UI.daily, p = per(D.per) || eq[0], h = HOY(), ayer = (() => { let d = mas(h, -1); while ([0, 6].includes(fDe(d).getDay())) d = mas(d, -1); return d; })();
  const mis = p ? delSprint(s).filter(i => i.resp === p.id) : [], log = mis.filter(i => i.col === 'fin' && i.fin >= ayer), hoyL = mis.filter(i => i.col === 'prog'), sig = mis.filter(i => i.col === 'no' && reqOk(i))[0];
  const obs = p ? abiertos().filter(x => mis.some(i => i.id === x.item)) : [];
  const fila = i => `<div class="mini"><span class="cd">${esc(i.cod)}</span><span class="ti" data-a="abrir" data-id="${i.id}" tabindex="0">${esc(i.t)}</span><span class="op apag num" style="font-size:13px">${dodN(i)} de ${a.dod.length} criterios</span>${pilListo(i)}</div>`;
  const mm = String(Math.floor(D.seg / 60)).padStart(2, '0') + ':' + String(D.seg % 60).padStart(2, '0'), C = 2 * Math.PI * 96;
  return cab('La Daily revisa en quince minutos qué se logró, qué sigue y qué obstáculos hay') +
    `<div class="g g12" style="margin-bottom:18px">
      <div class="panel" style="display:flex;flex-direction:column;align-items:center;gap:16px"><div class="reloj ${D.seg === 0 ? 'fin' : ''}" id="reloj"><svg viewBox="0 0 200 200"><circle class="f" cx="100" cy="100" r="96"/><circle class="p" cx="100" cy="100" r="96" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - D.seg / 900)}"/></svg><div>${mm}</div></div>
        <div style="display:flex;gap:8px"><button class="bt pri" data-a="reloj">${ic(D.on ? 'pausa' : 'play')}${D.on ? 'Pausar' : D.seg < 900 ? 'Continuar' : 'Iniciar'}</button><button class="bt" data-a="relojCero">Reiniciar</button></div>
        <div class="apag" style="font-size:13px;text-align:center">Sprint ${sprN(s.id)} · ${esc(s.nombre)}</div></div>
      <div class="panel ac"><div class="turnos" role="tablist">${eq.map(x => `<button class="turno ${p && x.id === p.id ? 'on' : ''} ${D.vistos[x.id] && !(p && x.id === p.id) ? 'visto' : ''}" data-a="turno" data-id="${x.id}" role="tab">${avatar(x.id)}${esc(x.nombre || x.ini)}</button>`).join('')}</div>
        ${p ? `<div class="preg">Qué logré ayer</div>${log.map(fila).join('') || '<div class="apag">Sin actividades finalizadas desde la reunión anterior.</div>'}
        <div class="preg">Qué lograré hoy</div>${hoyL.map(fila).join('') || (sig ? fila(sig) : '<div class="apag">No tiene actividades en progreso ni listas para empezar.</div>')}
        <div class="preg">Qué obstáculos impiden mi avance</div>${obs.map(x => `<div class="mini" style="grid-template-columns:minmax(0,1fr) auto"><span>${esc(x.t)}</span><span class="pil te">${haceD(dias(x.fecha, h))}</span></div>`).join('')}
        <form class="dir" data-f="obst" style="margin-top:10px"><input class="in" name="t" placeholder="Escriba el obstáculo y presione Enter" aria-label="Nuevo obstáculo"><select class="in" name="item" style="max-width:170px" aria-label="Actividad">${mis.filter(i => i.col !== 'fin').map(i => `<option value="${i.id}">${esc(i.cod)}</option>`).join('')}<option value="">General</option></select><button class="bt ch">${ic('mas')}Registrar</button></form>` : '<div class="vacio">Agregue al Scrum Team en el lienzo.</div>'}</div>
    </div>
    <div class="panel te"><h2>Obstáculos del equipo<span class="der"><button class="bt ch" data-a="masImped">${ic('mas')}Obstáculo</button></span></h2>${rejilla(a.imped, 'imped', [['fecha', 'Fecha', 'fecha', '128px'], ['t', 'Obstáculo', 'txt'], ['item', 'Actividad', 'sel', '110px', () => [['', 'General'], ...a.items.map(i => [i.id, i.cod])]], ['resp', 'Quién lo resuelve', 'sel', '21%', () => opPers()], ['estado', 'Estado', 'sel', '112px', [['a', 'Abierto'], ['r', 'Resuelto']]], ['fres', 'Resuelto el', 'fecha', '128px']], { vacio: 'Sin obstáculos registrados.' })}</div>`;
};

/* ---------- sprint review ---------- */
V.review = () => {
  const a = A(), s = sprintVista(); if (!s) return sinSprint();
  const n = sprN(s.id), t = delSprint(s), f = t.filter(i => i.col === 'fin'), p = t.filter(i => i.col !== 'fin'), rs = a.res.filter(r => r.sprint === s.id && !r.cer), sig = a.sprints[n];
  s.rev = s.rev || {};
  return cab('El Sprint Review presenta al auditado las observaciones y los resultados preliminares', chips()) +
    `<div class="g g3" style="margin-bottom:18px">
      <div class="panel"><div class="cif"><b data-n="${f.length}">0<small>de ${t.length}</small></b><span>Actividades finalizadas en el sprint ${n}</span></div></div>
      <div class="panel" style="grid-column:span 2"><div class="rot" style="margin-bottom:8px">Objetivo del sprint ${n}</div><div class="serif" style="font-size:21px;line-height:1.3;margin-bottom:14px">${esc(s.objetivo) || '<span class="apag">Sin objetivo definido</span>'}</div>
